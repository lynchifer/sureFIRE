# Engine CI — the Kotlin Multiplatform math engine. Runs on its own whenever engine/ changes.
name: engine

on:
  push:
    branches: [main]
    paths: ['engine/**', '.github/workflows/engine.yml']
  pull_request:
    paths: ['engine/**', '.github/workflows/engine.yml']
  workflow_dispatch:

permissions:
  contents: read

# Rapid successive pushes to the same ref shouldn't run the full test suite redundantly in parallel.
concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run JVM tests (the parity + math suite)
        run: ./gradlew --no-daemon jvmTest
