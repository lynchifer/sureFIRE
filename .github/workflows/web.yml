# Web CI + GitHub Pages deploy. The web app imports the engine's built JS package
# (web/package.json -> file:../engine/build/dist/js/productionLibrary, which is git-ignored),
# so every web build must FIRST build the engine's JS distribution.
#
#   build  — validates the web on PRs and on main (also packages the site on main)
#   deploy — publishes the packaged site to GitHub Pages (main only)
name: web

on:
  push:
    branches: [main]
    paths: ['web/**', 'engine/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'engine/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write       # deploy to Pages
  id-token: write    # OIDC token for the Pages deployment

# Let an in-flight deploy finish; don't cancel a publish midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 1. Build the engine's JS package the web depends on (also runs Kotlin/JS yarn setup).
      - name: Build engine JS distribution
        working-directory: engine
        run: ./gradlew --no-daemon jsNodeProductionLibraryDistribution

      # 2. Install + build the web. Pages serves a project site at /<repo>/, so set Vite's base to match.
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build web
        working-directory: web
        run: |
          npx tsc -b
          npx vite build --base="/${{ github.event.repository.name }}/"

      # 3. On main, package web/dist as the Pages artifact for the deploy job.
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    # Only publish from main; PRs just build above.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true # auto-enable Pages on first run (needs a plan that allows Pages for this repo)
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
